services:
  schedule-web:
    image: nginx:1.27-alpine
    container_name: schedule-web
    restart: unless-stopped
    ports:
      - "${SCHEDULE_BIND_IP:-127.0.0.1}:8085:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./releases:/usr/share/nginx/releases:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      schedule-upload:
        condition: service_healthy

  schedule-upload:
    image: python:3.12-alpine
    container_name: schedule-upload
    restart: unless-stopped
    environment:
      UPLOAD_PASSWORD: ${SCHEDULE_UPLOAD_PASSWORD:?set SCHEDULE_UPLOAD_PASSWORD}
      PUBLISH_TOKEN: ${SCHEDULE_PUBLISH_TOKEN:?set SCHEDULE_PUBLISH_TOKEN}
      UPLOAD_DATA_DIR: /data
      UPLOAD_MAX_BYTES: 8388608
    command: ["python", "/app/upload_api.py"]
    volumes:
      - ./server/upload-api/upload_api.py:/app/upload_api.py:ro
      - ./upload-queue:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
